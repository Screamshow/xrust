name: Build OpenWrt Platforms

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.*"
      - ".cargo/**"
      - ".github/workflows/build-all.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-musl
            target: x86_64-unknown-linux-musl
            budget: 13631488
          - name: aarch64-musl
            target: aarch64-unknown-linux-musl
            budget: 12582912
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: C compiler for x86_64 musl mimalloc
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --locked --workspace --no-default-features --features rust-x --release --target ${{ matrix.target }}
      - name: Size budget (13 MiB x86_64, 12 MiB ARM64)
        run: test "$(stat -c%s target/${{ matrix.target }}/release/tachyon-core)" -le ${{ matrix.budget }}
      - name: Architecture check
        run: file target/${{ matrix.target }}/release/tachyon-core
      - name: Pack
        run: |
          name="rust-x-${{ matrix.name }}"
          cp "target/${{ matrix.target }}/release/tachyon-core" "$name"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            rust-x-${{ matrix.name }}.tar.gz
            rust-x-${{ matrix.name }}.tar.gz.sha256
          if-no-files-found: error

  summary:
    name: Package checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify checksums
        run: |
          cd artifacts
          cat ./*.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: artifacts/SHA256SUMS

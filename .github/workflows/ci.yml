name: CI

on:
  push:
    branches: [main]
  pull_request:

# New commits supersede earlier CI runs on the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SB_REF_VERSION: v1.14.2-lx.11

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features legacy-protocols -- -D warnings
      - run: cargo test -p core-config --no-default-features --features rust-x --test rust_x_profile
      - run: cargo check --workspace --no-default-features --features rust-x
      - run: cargo test --workspace --features legacy-protocols
      # The exit gate needs CAP_NET_ADMIN (tproxy); re-run it as root so CI
      # covers what the unprivileged `cargo test` above can only skip.
      - name: Exit gate (privileged)
        run: |
          sudo -E env "PATH=$PATH" XRUST_TEST_REQUIRE_SO_MARK=1 cargo test -p core-runtime --features legacy-protocols --lib outbound::dial::tests::the_options_reach_the_socket -- --exact
          sudo -E env "PATH=$PATH" cargo test -p core-runtime --features legacy-protocols --test exit_gate -- --nocapture
          sudo -E env "PATH=$PATH" cargo test -p core-runtime --features legacy-protocols --test inbounds -- --nocapture

  differential:
    name: check vs sing-box-lx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # run.sh refuses to start without a binary, so this build is not optional.
      - name: Build xrust
        run: cargo build --workspace --features legacy-protocols
      - name: Fetch reference sing-box-lx
        run: |
          curl -fsSL -o ref.tar.gz \
            "https://github.com/Leadaxe/sing-box-lx/releases/download/${SB_REF_VERSION}/sing-box-${SB_REF_VERSION#v}-linux-amd64.tar.gz"
          mkdir -p "$HOME/ref" && tar -xzf ref.tar.gz -C "$HOME/ref"
          REF_BIN="$(find "$HOME/ref" -type f -name sing-box | head -1)"
          chmod +x "$REF_BIN"
          echo "SING_BOX_REF=$REF_BIN" >> "$GITHUB_ENV"
          "$REF_BIN" version
      - name: Run differential harness
        env:
          STRICT: "1"
        run: bash tests/differential/run.sh

  cross:
    name: Cross build (musl)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            budget: 13631488
          - target: aarch64-unknown-linux-musl
            budget: 12582912
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Preserve the target-specific crypto and static linker flags in Cargo config.
      - name: C compiler for x86_64 musl mimalloc
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --locked --workspace --no-default-features --features rust-x --release --target ${{ matrix.target }}
      - name: Size budget (13 MiB x86_64, 12 MiB ARM64)
        run: |
          size=$(stat -c%s "target/${{ matrix.target }}/release/xrust")
          echo "size=$size bytes"
          test "$size" -le ${{ matrix.budget }}
      - uses: actions/upload-artifact@v4
        with:
          name: xrust-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/xrust

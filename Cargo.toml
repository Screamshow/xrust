[workspace]
resolver = "2"
members = [
    "crates/core-cli",
    "crates/core-config",
    "crates/core-crypto",
    "crates/core-experimental",
    "crates/core-runtime",
    "crates/core-tls",
]

# h2 with UNCLAIMED_DENOMINATOR 2 -> 32: WINDOW_UPDATE every window/32
# instead of window/2. grpc-go fills its 64 KiB send quota then stops until a
# WU lands, so a 4 MiB connection window updated at window/2 pauses the single
# stream for ~7 ms every 6 MiB and vmess-grpc tput_1 ran at 0.5-0.7x of the
# reference; at window/32 the stream stays fed and tput_1 reaches parity
# (2.63 vs 2.74 Gbit/s). Vendored: upstream h2 has no knob for this ratio.
[patch.crates-io]
h2 = { path = "vendor/h2" }
# Library API extension for binary VLESS contexts; hash implementation unchanged.
blake3 = { path = "vendor/blake3" }

[workspace.package]
version = "0.0.26"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Dushnilin/tachyon-core"
rust-version = "1.89"

[workspace.dependencies]
argon2 = "0.5"
blake2 = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
flate2 = "1"
anyhow = "1"
aes = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
# pure-Rust backend: the C implementation would need a cross cc for musl
# (build.rs + cc, no toolchain by the no-c rule). Audited 2026-10-07: all
# four blake3 call sites are connection setup -- vless-enc ClientHello and
# tickets, shadowsocks-2022 subkey -- never a packet, so the SIMD backend
# would only touch handshakes. Deliberately left alone.
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }
brotli = "9"
bytes = "1"
cfb-mode = "0.8"
chacha20poly1305 = "0.10"
ml-kem = "0.2"
ctr = "0.9"
# constant-time tag compares for the snell batch opener
subtle = "2.6"
rand_core = "0.6"
getrandom = "0.3"
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
# `mdns` teaches the wire codec about the two mDNS class bits (RFC 6762 5.4 and
# 10.2), so a multicast response parses into ordinary records without us
# touching the class byte by hand.
hickory-proto = { version = "0.26", features = ["mdns"] }
hkdf = "0.12"
hmac = "0.12"
http = "1"
# interface addresses for the mDNS transport's per-interface sockets
if-addrs = "0.15"
md-5 = "0.10"
libc = "0.2"
# true LRU for the dns response cache: eviction was a full scan of the map
lru = "0.12"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "log"] }
regex = "1"
# Already in the tree through `regex`, so linking it directly costs no extra
# binary size: `rule_keyword` matching is substring search, which is exactly what
# an Aho-Corasick automaton is for.
aho-corasick = "1"
rustls-pemfile = "2"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
smoltcp = { version = "0.14", default-features = false }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false

# With opt-level = 3 above these overrides change nothing. They are kept for a
# size-first profile, but they are not enough for one: with opt-level = "s"
# (plus core-crypto = 3) the binary loses ~28 %, yet the generic RustCrypto
# AEADs are instantiated and LTO-optimized outside these crates and run ~3x
# slower, and TLS ChaCha20-Poly1305 end to end loses ~22 % on x86_64. ChaCha on
# aarch64 goes through the same RustCrypto path, so do not switch to "s"
# without a Cortex-A53 measurement.
[profile.release.package.aes]
opt-level = 3
[profile.release.package.aes-gcm]
opt-level = 3
[profile.release.package.ghash]
opt-level = 3
[profile.release.package.polyval]
opt-level = 3
[profile.release.package.chacha20]
opt-level = 3
[profile.release.package.chacha20poly1305]
opt-level = 3
[profile.release.package.poly1305]
opt-level = 3
[profile.release.package.ctr]
opt-level = 3
[profile.release.package.cipher]
opt-level = 3
[profile.release.package.universal-hash]
opt-level = 3
[profile.release.package.cfb-mode]
opt-level = 3
[profile.release.package.blake3]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.sha1]
opt-level = 3
[profile.release.package.md-5]
opt-level = 3
[profile.release.package.hmac]
opt-level = 3
[profile.release.package.memchr]
opt-level = 3


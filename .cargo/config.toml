# Supported Rust X release targets: OpenWrt x86_64 and aarch64.
# ARM crypto cfgs retain runtime CPU detection; x86 uses a generic baseline.

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = [
    "--cfg", "aes_armv8",
    "--cfg", "polyval_armv8",
    "--cfg", "chacha20_force_neon",
    # panic = "abort" and strip = "symbols": nothing unwinds and backtraces
    # have no names, so the unwind tables are dead weight (-280 KiB, mostly
    # .eh_frame). Not on x86_64: there LLVM emits them anyway, size unchanged.
    "-C", "force-unwind-tables=no",
    # Linker flags live here, not in the environment, for the reason at the top
    # of this file: `RUSTFLAGS=-C linker=rust-lld ...` on the command line is
    # what silently dropped this array. That build is what measured 0.03 GiB/s
    # AES-GCM on a Cortex-A53 -- the software path, with the same number the
    # cfgs being off produces on the desktop.
    "-C", "link-self-contained=yes",
    "-C", "link-arg=--icf=safe",
    "-C", "link-arg=-z",
    "-C", "link-arg=noseparate-code",
    "-C", "link-arg=-z",
    "-C", "link-arg=norelro",
]

# Both musl targets have no system linker on a Windows host and no toolchain
# symlinks on a Linux one; rust-lld with the self-contained CRT is the only
# combination that links everywhere.
#
# Generic x86-64 release baseline. Crypto implementations can still use
# runtime feature detection without making AVX2 mandatory for the package.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-self-contained=yes", "-C", "target-cpu=x86-64", "-C", "link-arg=--icf=safe", "-C", "link-arg=-z", "-C", "link-arg=noseparate-code", "-C", "link-arg=-z", "-C", "link-arg=norelro"]

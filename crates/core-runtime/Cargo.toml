[package]
name = "core-runtime"
description = "Xrust data plane runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Upstream protocols remain available; the explicit Rust X build omits them.
legacy-protocols = ["core-config/legacy-protocols", "dep:argon2", "dep:blowfish", "dep:cast5", "dep:des", "dep:ripemd", "dep:aria", "dep:camellia", "dep:sm4", "dep:kisaseed", "dep:lz4_flex", "dep:cipher05"]
default = ["full", "legacy-protocols"]
rust-x = ["full"]
full = [
    "clash-api",
    "core-config/full",
]
clash-api = []
allocstat = []

[dependencies]
argon2 = { workspace = true, optional = true }
core-config = { path = "../core-config", default-features = false }
core-crypto = { path = "../core-crypto" }
core-experimental = { path = "../core-experimental" }
core-tls = { path = "../core-tls" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
smoltcp = { workspace = true, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
] }
x25519-dalek.workspace = true
aes.workspace = true
aes-gcm.workspace = true
base64.workspace = true
blake2.workspace = true
blake3.workspace = true
bytes.workspace = true
cfb-mode.workspace = true
chacha20 = "0.9"
crypto_box = { version = "0.9", default-features = false, features = ["alloc", "salsa20"] }
chacha20poly1305.workspace = true
ml-kem.workspace = true
ctr.workspace = true
subtle.workspace = true
rand_core.workspace = true
getrandom.workspace = true
h2.workspace = true
h3.workspace = true
h3-quinn.workspace = true
hickory-proto.workspace = true
if-addrs.workspace = true
hkdf.workspace = true
hmac.workspace = true
http.workspace = true
# raw DEFLATE for the external_ui bundle; miniz_oxide keeps it pure Rust
flate2.workspace = true
md-5.workspace = true
quinn.workspace = true
regex.workspace = true
aho-corasick.workspace = true
rustls-pemfile.workspace = true
sha1.workspace = true
sha2.workspace = true
sha3.workspace = true
tokio-rustls.workspace = true
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "macros",
    "signal",
    "sync",
    "time",
] }
socket2 = { version = "0.6", features = ["all"] }
blowfish = { version = "0.10", optional = true }
cast5 = { version = "0.12", optional = true }
des = { version = "0.9", optional = true }
ripemd = { version = "0.1", optional = true }
aria = { version = "0.2", optional = true }
camellia = { version = "0.2", optional = true }
sm4 = { version = "0.6", optional = true }
kisaseed = { version = "0.1.3", optional = true }
# pure rust: no c toolchain, which the no-c rule and the musl cross build
# both require. Only the block codec is used.
lz4_flex = { version = "0.11", default-features = false, features = ["std"], optional = true }
lru.workspace = true
# Two `cipher` generations coexist: aes 0.8 / kisaseed use 0.4, while
# aria / camellia / cast5 / des / sm4 use 0.5 (inout API).
cipher = "0.4"
cipher05 = { package = "cipher", version = "0.5", optional = true }
# 64-bit atomics on mips32: std::sync::atomic::AtomicU64 does not exist
# there and the mips build dies on the import. On every target that has
# native LL/SC for 64 bits this is the same type std uses, so nothing
# changes for aarch64/x86_64/armv6.
portable-atomic = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

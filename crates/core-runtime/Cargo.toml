[package]
name = "core-runtime"
description = "Xrust data plane runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["full"]
# Kept as an alias: packaging and test scripts build with
# `--no-default-features --features rust-x`.
rust-x = ["full"]
full = [
    "clash-api",
    "core-config/full",
]
clash-api = []
allocstat = []

[dependencies]
core-config = { path = "../core-config", default-features = false }
core-crypto = { path = "../core-crypto" }
core-experimental = { path = "../core-experimental" }
core-tls = { path = "../core-tls" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
smoltcp = { workspace = true, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
] }
x25519-dalek.workspace = true
aes.workspace = true
aes-gcm.workspace = true
base64.workspace = true
blake2.workspace = true
blake3.workspace = true
bytes.workspace = true
chacha20 = "0.9"
crypto_box = { version = "0.9", default-features = false, features = ["alloc", "salsa20"] }
chacha20poly1305.workspace = true
ml-kem.workspace = true
ctr.workspace = true
rand_core.workspace = true
getrandom.workspace = true
h2.workspace = true
h3.workspace = true
h3-quinn.workspace = true
# For the congestion controller trait's own types (`RttEstimator`), which quinn
# does not re-export; the workspace patch points this at vendor/quinn-proto.
quinn-proto = { version = "0.11.18", default-features = false }
hickory-proto.workspace = true
if-addrs.workspace = true
hkdf.workspace = true
hmac.workspace = true
http.workspace = true
# raw DEFLATE for the external_ui bundle; miniz_oxide keeps it pure Rust
flate2.workspace = true
quinn.workspace = true
regex.workspace = true
aho-corasick.workspace = true
rustls-pemfile.workspace = true
sha1.workspace = true
sha2.workspace = true
tokio-rustls.workspace = true
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "macros",
    "signal",
    "sync",
    "time",
] }
socket2 = { version = "0.6", features = ["all"] }
lru.workspace = true
# 64-bit atomics on mips32: std::sync::atomic::AtomicU64 does not exist
# there and the mips build dies on the import. On every target that has
# native LL/SC for 64 bits this is the same type std uses, so nothing
# changes for aarch64/x86_64/armv6.
portable-atomic = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package]
name = "core-cli"
description = "Xrust: sing-box-compatible proxy core optimized for routers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "xrust"
path = "src/main.rs"

[features]
default = ["full"]
# Kept as an alias: packaging and test scripts build with
# `--no-default-features --features rust-x`.
rust-x = ["full"]
full = [
    "core-config/full",
    "core-runtime/full",
]
# counting allocator + per-second heap dump, see src/allocstat.rs
allocstat = ["core-runtime/allocstat", "dep:portable-atomic"]

[dependencies]
portable-atomic = { version = "1", optional = true }
core-config = { path = "../core-config", default-features = false }
core-runtime = { path = "../core-runtime", default-features = false }
serde_json.workspace = true
anyhow.workspace = true
base64.workspace = true
rand_core = { version = "0.6.4", default-features = false, features = ["getrandom"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(all(target_os = "linux", not(target_env = "msvc")))'.dependencies]
libc.workspace = true

[target.'cfg(all(target_os = "linux", not(target_env = "msvc"), target_arch = "x86_64"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }
